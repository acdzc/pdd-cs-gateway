name: Bug 报告
description: 报告网关、平台集成或部署中的可复现问题
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 问题区域
      options:
        - 拼多多 Webhook / API
        - 消息处理与意图分类
        - 飞书通知
        - OpenClaw 集成
        - Docker / 部署
        - 其他
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Python 版本、系统、部署方式、提交版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue
          required: true
        - label: 我已删除密钥、订单、用户身份和聊天数据
          required: true
